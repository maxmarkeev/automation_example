name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  api-smoke:
    name: API Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API smoke tests
        run: pytest -m "api and smoke" --alluredir=allure-results
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api-smoke
          path: allure-results/
          if-no-files-found: warn

  api-regression:
    name: API Regression
    runs-on: ubuntu-latest
    needs: [api-smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API regression tests
        run: pytest -m "api and regression" --alluredir=allure-results
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api-regression
          path: allure-results/
          if-no-files-found: warn

  ui-smoke:
    name: UI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run UI smoke tests
        run: pytest -m "ui and smoke" --alluredir=allure-results
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-smoke
          path: allure-results/
          if-no-files-found: warn

  ui-regression:
    name: UI Regression
    runs-on: ubuntu-latest
    needs: [ui-smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run UI regression tests
        run: pytest -m "ui and regression" --alluredir=allure-results
        env:
          BASE_URL: https://automationexercise.com

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-regression
          path: allure-results/
          if-no-files-found: warn

  publish-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [api-smoke, api-regression, ui-smoke, ui-regression]
    if: always() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results/
          merge-multiple: true
        continue-on-error: true

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Restore Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy history into results
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi
        continue-on-error: true

      - name: Generate report
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
